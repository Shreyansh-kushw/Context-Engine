services:
  # PostgreSQL with pgvector extension enabled
  db:
    image: pgvector/pgvector:pg16
    container_name: context_engine_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: context_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d context_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: context_engine_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/context_engine
      - DATABASE_URL_ALEMBIC=postgresql+psycopg://postgres:postgrespassword@db:5432/context_engine
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./upload_files:/app/upload_files

  # Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        API_KEY: ${API_KEY}
    container_name: context_engine_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - API_KEY=${API_KEY}
    depends_on:
      - backend

volumes:
  pgdata:
